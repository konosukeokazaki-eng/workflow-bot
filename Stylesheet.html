<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap');

/* ============================================================
   Design Tokens - Google Chat / Material Design 3 inspired
   ============================================================ */
:root {
  /* Primary (Google Blue M3) */
  --c-primary: #0b57d0;
  --c-primary-hover: #0842a0;
  --c-primary-container: #d3e3fd;
  --c-on-primary-container: #001b3f;

  /* Semantic */
  --c-danger: #b3261e;
  --c-danger-hover: #8c1d18;
  --c-danger-container: #f9dedc;
  --c-success: #146c2e;
  --c-success-container: #c8e6c9;
  --c-warn: #825800;
  --c-warn-container: #ffdea9;

  /* Neutral (Google grays) */
  --c-text: #1f1f1f;
  --c-text-sub: #444746;
  --c-text-muted: #5f6368;
  --c-text-faint: #9aa0a6;

  /* Surface */
  --c-bg: #eef4fc;              /* Chat の淡い青背景 */
  --c-bg-strong: #e4ecf7;
  --c-surface: #ffffff;
  --c-surface-variant: #f0f4f9;
  --c-surface-container: #f7f9fc;
  --c-outline: #c4c7c5;
  --c-outline-variant: #dadce0;
  --c-field-bg: #f7f9fc;

  /* Shape scale (M3) */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius: 12px;                /* medium */
  --radius-lg: 16px;              /* large - cards */
  --radius-xl: 28px;              /* extra-large - modals */
  --radius-full: 999px;

  /* M3 elevation (最小限のドロップ + tonal) */
  --shadow-1: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 1px rgba(0,0,0,0.04);
  --shadow-2: 0 1px 2px 0 rgba(0,0,0,0.06), 0 2px 6px 2px rgba(0,0,0,0.04);
  --shadow-3: 0 1px 3px 0 rgba(0,0,0,0.08), 0 4px 8px 3px rgba(0,0,0,0.05);
  --shadow-4: 0 2px 3px 0 rgba(0,0,0,0.08), 0 6px 10px 4px rgba(0,0,0,0.05);
  --shadow-5: 0 4px 4px 0 rgba(0,0,0,0.10), 0 8px 12px 6px rgba(0,0,0,0.06);

  --font: 'Manrope', 'Noto Sans JP', 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --transition-fast: 0.15s cubic-bezier(0.2, 0, 0, 1);
  --transition-normal: 0.25s cubic-bezier(0.2, 0, 0, 1);
  --transition-emphasized: 0.4s cubic-bezier(0.3, 0, 0, 1);
}

/* ============================================================
   Reset & Base
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body { font-family:var(--font); background:var(--c-bg); color:var(--c-text); font-size:14px; line-height:1.5; letter-spacing:0; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#c4c7c5; border-radius:5px; border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover { background:#9aa0a6; background-clip:padding-box; border:3px solid transparent; }

/* Material Symbols */
.mi { font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal; font-size:20px; line-height:1; vertical-align:middle; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr; -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; }

/* ============================================================
   Layout
   ============================================================ */
.app { display:grid; grid-template-columns:280px 1fr; height:100vh; background:var(--c-bg); }

/* Sidebar */
.sidebar { background:var(--c-surface); border-right:1px solid var(--c-outline-variant); display:flex; flex-direction:column; }
.sidebar-header { padding:20px 16px 12px; display:flex; align-items:center; justify-content:space-between; }
.sidebar-header h1 { font-size:20px; font-weight:600; letter-spacing:-0.01em; color:var(--c-text); }
.sidebar-footer { padding:8px; margin-top:auto; border-top:1px solid var(--c-outline-variant); display:flex; gap:2px; flex-wrap:wrap; }
.sidebar-meta { width:100%; padding:8px 8px 4px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--c-text-faint); }
.sidebar-meta-link { color:var(--c-primary); text-decoration:none; }
.sidebar-meta-link:hover { text-decoration:underline; }

/* Workflow search */
.wf-search { padding:0 12px 8px; position:relative; }
.wf-search-icon { position:absolute; left:22px; top:50%; transform:translateY(-50%); font-size:18px; color:var(--c-text-faint); pointer-events:none; }
.wf-search input { width:100%; padding:8px 12px 8px 44px; border:1px solid var(--c-outline-variant); background:var(--c-field-bg); border-radius:var(--radius-full); font-size:13px; color:var(--c-text); outline:none; transition:border-color var(--transition-fast), background var(--transition-fast); }
.wf-search input:focus { border-color:var(--c-primary); background:var(--c-surface); }

/* Workflow list */
.wf-list { flex:1; overflow-y:auto; padding:4px 8px; }
.wf-item { padding:10px 16px; border-radius:var(--radius-full); cursor:pointer; margin-bottom:2px; border:none; background:transparent; display:flex; align-items:center; justify-content:space-between; transition:background var(--transition-fast); position:relative; }
.wf-item:hover { background:var(--c-surface-variant); }
.wf-item.active { background:var(--c-primary-container); }
.wf-item.active .wf-item-name { color:var(--c-on-primary-container); font-weight:600; }
.wf-item-left { flex:1; min-width:0; }
.wf-item-name { font-size:14px; font-weight:500; color:var(--c-text); letter-spacing:0; }
.wf-item-meta { font-size:11px; color:var(--c-text-muted); margin-top:3px; display:flex; align-items:center; gap:6px; }

/* Main */
.main { overflow-y:auto; padding:24px; }
.main-inner { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1280px; animation:contentFadeIn 0.4s cubic-bezier(0.2, 0, 0, 1); }
.panel { background:var(--c-surface); border-radius:var(--radius-lg); border:1px solid var(--c-outline-variant); padding:24px; transition:box-shadow var(--transition-normal); }
.panel:hover { box-shadow:var(--shadow-1); }
.panel h2 { font-size:20px; font-weight:600; letter-spacing:-0.01em; color:var(--c-text); margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }

/* ============================================================
   Buttons - M3 pill-shaped
   ============================================================ */
.btn { padding:10px 24px; border:1px solid var(--c-outline); border-radius:var(--radius-full); background:transparent; cursor:pointer; font-size:14px; font-weight:500; font-family:var(--font); color:var(--c-primary); display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all var(--transition-fast); position:relative; user-select:none; letter-spacing:0.01em; height:40px; white-space:nowrap; flex-shrink:0; }
.btn:hover { background:rgba(11, 87, 208, 0.08); border-color:var(--c-primary); }
.btn:active { background:rgba(11, 87, 208, 0.12); }

.btn-primary { background:var(--c-primary); color:#fff; border:1px solid transparent; }
.btn-primary:hover { background:var(--c-primary-hover); box-shadow:var(--shadow-1); border-color:transparent; }
.btn-primary:active { background:var(--c-primary-hover); box-shadow:none; }

/* Tonal (Google Chat の代表的なボタンスタイル) */
.btn-tonal { background:var(--c-primary-container); color:var(--c-on-primary-container); border:1px solid transparent; }
.btn-tonal:hover { background:#c1d5f5; border-color:transparent; box-shadow:var(--shadow-1); }

.btn-danger { color:var(--c-danger); border-color:var(--c-outline); background:transparent; }
.btn-danger:hover { background:rgba(179, 38, 30, 0.08); border-color:var(--c-danger); }

.btn-sm { padding:6px 14px; font-size:13px; height:32px; min-width:56px; line-height:1; }
.btn-ghost { border:none; color:var(--c-text-sub); padding:8px 14px; font-size:13px; font-weight:500; background:transparent; height:36px; border-radius:var(--radius-full); }
.btn-ghost:hover { color:var(--c-primary); background:var(--c-primary-container); border:none; }

.btn-add { width:100%; padding:12px; font-size:13px; font-weight:500; border:1px dashed var(--c-outline); background:transparent; border-radius:var(--radius); color:var(--c-primary); cursor:pointer; margin-top:8px; transition:all var(--transition-fast); font-family:var(--font); letter-spacing:0.01em; }
.btn-add:hover { border-color:var(--c-primary); background:var(--c-primary-container); border-style:solid; }

/* ============================================================
   Section Chips (Google Chat 風のナビゲーション)
   ============================================================ */
.chip-nav { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; padding-bottom:16px; border-bottom:1px solid var(--c-outline-variant); }
.chip { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius-full); border:1px solid var(--c-outline); background:transparent; color:var(--c-text-sub); font-size:13px; font-weight:500; cursor:pointer; transition:all var(--transition-fast); font-family:var(--font); letter-spacing:0.01em; height:34px; position:relative; }
.chip:hover { background:var(--c-primary-container); color:var(--c-on-primary-container); border-color:transparent; }
.chip.active { background:var(--c-primary-container); color:var(--c-on-primary-container); border-color:transparent; font-weight:600; }
.chip.active .chip-num { background:var(--c-primary); color:#fff; }
.chip-num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--c-outline-variant); color:var(--c-text-sub); font-size:11px; font-weight:700; }
.chip-error-dot { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--c-danger); border:2px solid var(--c-surface); }
.editor-section { animation:contentFadeIn 0.25s ease; }
.editor-section.hidden { display:none; }

/* ============================================================
   Badges (Tonal chips)
   ============================================================ */
.badge { font-size:11px; padding:3px 10px; border-radius:var(--radius-sm); font-weight:600; letter-spacing:0.01em; }
.badge-active { background:var(--c-success-container); color:var(--c-success); }
.badge-inactive { background:#e8eaed; color:var(--c-text-muted); }
.badge-approval { background:var(--c-primary-container); color:var(--c-on-primary-container); }
.badge-template { background:var(--c-warn-container); color:var(--c-warn); }

/* ============================================================
   Toggle (Material 3 switch)
   ============================================================ */
.toggle { position:relative; width:44px; height:24px; cursor:pointer; }
.toggle input { display:none; }
.toggle-slider { position:absolute; top:0; left:0; right:0; bottom:0; background:var(--c-outline-variant); border:2px solid var(--c-outline); border-radius:24px; transition:all 0.2s; }
.toggle-slider:before { content:''; position:absolute; height:14px; width:14px; left:3px; top:50%; transform:translateY(-50%); background:var(--c-text-muted); border-radius:50%; transition:all 0.2s; }
.toggle input:checked+.toggle-slider { background:var(--c-primary); border-color:var(--c-primary); }
.toggle input:checked+.toggle-slider:before { transform:translate(20px, -50%); width:18px; height:18px; background:#fff; }

/* ============================================================
   Forms - M3 outlined text fields
   ============================================================ */
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:500; color:var(--c-text-sub); margin-bottom:6px; letter-spacing:0.02em; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
input[type="text"], select { width:100%; padding:12px 16px; border:1px solid var(--c-outline); border-radius:var(--radius-xs); font-size:14px; font-family:var(--font); color:var(--c-text); background:var(--c-surface); transition:all var(--transition-fast); letter-spacing:0; }
input[type="text"]::placeholder { color:var(--c-text-faint); }
input:focus, select:focus { outline:none; border-color:var(--c-primary); border-width:2px; padding:11px 15px; }
input.input-error { border-color:var(--c-danger); animation:shake 0.3s ease; }
.error-msg { color:var(--c-danger); font-size:12px; margin-top:4px; font-weight:500; display:none; padding-left:4px; }
.error-msg.show { display:block; animation:slideDown 0.2s ease; }
.section-label { font-size:11px; color:var(--c-text-muted); text-transform:uppercase; letter-spacing:0.1em; margin:24px 0 10px; font-weight:700; }
.checkbox-row { display:flex; align-items:center; gap:10px; }
.checkbox-row input[type="checkbox"] { width:18px; height:18px; accent-color:var(--c-primary); cursor:pointer; }
.checkbox-row label { cursor:pointer; }

/* ============================================================
   Field & Button Items
   ============================================================ */
.field-list { display:flex; flex-direction:column; gap:6px; min-height:20px; }
.field-item { background:var(--c-surface); border:1px solid var(--c-outline-variant); border-radius:var(--radius); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; cursor:grab; transition:all var(--transition-fast); animation:itemSlideIn 0.25s ease; }
.field-item:hover { background:var(--c-surface-variant); border-color:var(--c-outline); }
.field-item.sortable-ghost { opacity:0.3; background:var(--c-primary-container); }
.field-item.sortable-chosen { box-shadow:var(--shadow-3); transform:scale(1.02); background:var(--c-surface); }
.field-info { display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1; min-width:0; }
.field-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.field-grip { color:var(--c-text-faint); font-size:18px; transition:color var(--transition-fast); cursor:grab; }
.field-item:hover .field-grip { color:var(--c-primary); }
.field-name { font-size:14px; font-weight:500; color:var(--c-text); }
.field-type { font-size:11px; background:var(--c-primary-container); padding:3px 10px; border-radius:var(--radius-sm); color:var(--c-on-primary-container); font-weight:500; letter-spacing:0.01em; }
.field-required { font-size:11px; color:var(--c-danger); font-weight:700; letter-spacing:0.02em; }
.field-actions { display:flex; flex-direction:row; flex-wrap:nowrap; flex-shrink:0; align-items:center; gap:6px; opacity:0.5; transition:opacity var(--transition-fast); }
.field-actions .btn { min-width:auto; }
.field-actions .btn-sm { min-width:52px; padding:6px 12px; }
.field-actions .btn-sm .mi { font-size:16px !important; line-height:1; }
.field-item:hover .field-actions { opacity:1; }

.btn-card { background:var(--c-surface); border:1px solid var(--c-outline-variant); border-radius:var(--radius); padding:14px; margin-bottom:6px; cursor:grab; transition:all var(--transition-fast); animation:itemSlideIn 0.25s ease; }
.btn-card:hover { background:var(--c-surface-variant); border-color:var(--c-outline); }
.btn-card.sortable-ghost { opacity:0.3; }
.btn-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.btn-card-title { font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; color:var(--c-text); }
.btn-card-sub { font-size:12px; color:var(--c-text-muted); }
.btn-card .field-actions { opacity:0.5; transition:opacity var(--transition-fast); }
.btn-card:hover .field-actions { opacity:1; }
.btn-color { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:4px; vertical-align:middle; box-shadow:0 0 0 1.5px rgba(255,255,255,0.9), 0 0 0 2.5px rgba(0,0,0,0.08); }

/* ============================================================
   Color Palette
   ============================================================ */
.color-palette { display:flex; gap:8px; margin-top:6px; }
.color-dot { width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all var(--transition-fast); position:relative; }
.color-dot:hover { transform:scale(1.1); }
.color-dot.selected { border-color:var(--c-text); transform:scale(1.05); box-shadow:0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-text); }

/* ============================================================
   Actions Bar
   ============================================================ */
.actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; padding-top:20px; border-top:1px solid var(--c-outline-variant); }
.action-section { background:var(--c-surface-variant); border-radius:var(--radius); padding:12px 16px; margin-top:10px; }

/* ============================================================
   Empty State
   ============================================================ */
.empty { text-align:center; padding:80px 20px; color:var(--c-text-muted); animation:contentFadeIn 0.4s ease; }
.empty p { margin-top:12px; font-size:14px; line-height:1.6; }

/* ============================================================
   Modal - M3 extra-large radius
   ============================================================ */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(31,31,31,0); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px); display:flex; align-items:center; justify-content:center; z-index:100; animation:overlayFadeIn 0.25s ease forwards; }
.modal { background:var(--c-surface); border-radius:var(--radius-xl); padding:24px; width:560px; max-width:90vw; max-height:90vh; overflow-y:auto; transform:scale(0.92) translateY(20px); opacity:0; animation:modalPop 0.35s cubic-bezier(0.3, 0, 0, 1) 0.05s forwards; box-shadow:var(--shadow-5); }
.modal h3 { font-size:22px; font-weight:600; margin-bottom:18px; color:var(--c-text); letter-spacing:-0.01em; }
.modal .actions { margin-top:20px; }

/* ============================================================
   Toast & Loading
   ============================================================ */
.toast { position:fixed; bottom:24px; right:24px; background:#322f35; color:#f5eff7; padding:14px 22px; border-radius:var(--radius-xs); font-size:14px; font-weight:500; z-index:200; animation:toastSlideIn 0.4s cubic-bezier(0.3, 0, 0, 1); box-shadow:var(--shadow-3); letter-spacing:0.01em; }
.loading-toast { position:fixed; bottom:24px; right:24px; background:var(--c-surface); padding:14px 24px; border-radius:var(--radius); font-size:14px; font-weight:500; color:var(--c-text); z-index:300; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-3); animation:toastSlideIn 0.3s ease; border:1px solid var(--c-outline-variant); }
.spinner { width:20px; height:20px; border:3px solid var(--c-primary-container); border-top-color:var(--c-primary); border-radius:50%; animation:spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite; }

/* ============================================================
   Preview - Google Chat card style
   ============================================================ */
.preview-section { margin-bottom:20px; }
.preview-section h2 { font-size:16px; }
.chat-card { background:var(--c-surface); border:1px solid var(--c-outline-variant); border-radius:var(--radius-lg); overflow:hidden; font-size:14px; box-shadow:var(--shadow-1); transition:box-shadow var(--transition-normal); }
.chat-card:hover { box-shadow:var(--shadow-2); }
.chat-card-header { background:var(--c-surface); padding:16px 20px; border-bottom:1px solid var(--c-outline-variant); }
.chat-card-header-title { font-size:16px; font-weight:600; color:var(--c-text); letter-spacing:-0.01em; }
.chat-card-header-sub { font-size:13px; color:var(--c-text-muted); margin-top:4px; }
.chat-card-body { padding:12px 20px; }
.chat-card-row { display:flex; flex-direction:column; padding:8px 0; border-bottom:1px solid var(--c-surface-variant); }
.chat-card-row:last-child { border-bottom:none; }
.chat-card-label { font-size:11px; color:var(--c-text-muted); font-weight:500; letter-spacing:0.03em; text-transform:uppercase; }
.chat-card-value { font-size:14px; margin-top:3px; color:var(--c-text); font-weight:400; }
.chat-card-buttons { padding:12px 20px 16px; display:flex; gap:8px; flex-wrap:wrap; }
.chat-btn { padding:8px 20px; border-radius:var(--radius-full); color:#fff; font-size:13px; font-weight:500; border:none; cursor:default; letter-spacing:0.01em; height:36px; display:inline-flex; align-items:center; }
.preview-label { font-size:12px; color:var(--c-text-faint); text-align:center; margin-top:12px; font-weight:400; letter-spacing:0.01em; }

.step-block { background:var(--c-surface-variant); border:1px solid var(--c-outline-variant); border-radius:var(--radius); padding:14px 18px; margin-bottom:6px; transition:all var(--transition-fast); }
.step-block:hover { background:var(--c-primary-container); border-color:transparent; }
.step-block-title { font-size:14px; font-weight:600; color:var(--c-text); margin-bottom:4px; letter-spacing:-0.005em; }
.step-block-content { font-size:12px; color:var(--c-text-muted); line-height:1.6; }
.step-arrow { text-align:center; color:var(--c-text-faint); font-size:20px; margin:4px 0; }

/* ============================================================
   Admin & Help
   ============================================================ */
.admin-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--c-surface-variant); border-radius:var(--radius); margin-bottom:6px; font-size:14px; font-weight:500; animation:itemSlideIn 0.2s ease; transition:background var(--transition-fast); }
.admin-item:hover { background:var(--c-primary-container); }
.help-section { line-height:1.8; font-size:14px; color:var(--c-text-sub); }
.help-section h4 { font-size:15px; color:var(--c-text); font-weight:600; margin:24px 0 8px; letter-spacing:-0.005em; display:flex; align-items:center; gap:8px; }
.help-section h4 .mi { font-size:20px; color:var(--c-primary); }
.help-section h5 { font-size:13px; color:var(--c-text); font-weight:600; margin:14px 0 4px; }
.help-section p { margin-bottom:10px; }
.help-section ol, .help-section ul { margin:0 0 12px 20px; padding:0; }
.help-section ol li, .help-section ul li { margin-bottom:4px; line-height:1.7; }
.help-section .help-note { background:var(--c-primary-container); border-radius:12px; padding:12px 16px; margin:12px 0; font-size:13px; color:var(--c-on-primary-container); }
.help-section .help-warn { background:#fef7e0; border-radius:12px; padding:12px 16px; margin:12px 0; font-size:13px; color:#7a4f00; }
.help-section table { width:100%; border-collapse:collapse; margin:8px 0 16px; font-size:13px; }
.help-section table th { text-align:left; padding:8px 10px; background:var(--c-surface-variant); font-weight:600; color:var(--c-text); border-bottom:1px solid var(--c-outline-variant); }
