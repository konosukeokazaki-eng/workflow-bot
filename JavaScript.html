<script>
/* ============================================================
   State
   ============================================================ */
var workflows=[], currentWfId=null, currentFields=[], currentButtons=[], spaces=[], admins=[];
var isDirty=false;
var wfEditorTab='basic';
var COLORS={green:'#34a853',blue:'#1a73e8',yellow:'#f9ab00',orange:'#e65100',red:'#c62828',gray:'#888'};
var EMOJI={green:'✅',blue:'🔵',yellow:'🟡',orange:'🟠',red:'❌',gray:'⚫'};
var currentUser=__currentUser||'';

/* ============================================================
   Init
   ============================================================ */
window.onload=function(){
  try{workflows=__initialData||[];}catch(e){}
  try{admins=__initialAdmins||[];}catch(e){}
  renderList();
  google.script.run.withSuccessHandler(function(d){spaces=d||[];}).withFailureHandler(noop).api_getSpaces();
  google.script.run.withSuccessHandler(function(s){if(s&&!s.accepted)showPrivacyModal();}).withFailureHandler(noop).api_getPrivacyStatus();
};
function showPrivacyModal(){
  var ov=mk('modal-overlay');
  ov.innerHTML=''
    +'<div class="modal" style="max-width:520px">'
    +'<h3>プライバシー通知への同意</h3>'
    +'<p style="font-size:13px;color:var(--c-text-sub);margin:12px 0">Workflow Bot を管理者として使用する前に、以下の内容にご同意ください。</p>'
    +'<div style="max-height:280px;overflow:auto;padding:12px;background:var(--c-bg-alt,#f7f7f8);border-radius:8px;font-size:12px;line-height:1.7">'
    +'<p><strong>取得する情報</strong>：氏名、メールアドレス、業務上入力される申請本文</p>'
    +'<p><strong>利用目的</strong>：申請・承認フローの実行、監査ログの保持</p>'
    +'<p><strong>保管場所</strong>：Google Workspace 内スプレッドシート(社内 Drive)。外部サービスへの送信はありません。</p>'
    +'<p><strong>保管期間</strong>：申請データ 3年、監査ログ 1年(オンライン)+ アーカイブ 3年、バックアップ 30世代</p>'
    +'<p><strong>アクセス制御</strong>：管理画面は _管理者 シートに登録されたユーザのみアクセス可能。全操作は監査ログに記録されます。</p>'
    +'</div>'
    +'<div class="actions"><button class="btn btn-primary" onclick="acceptPrivacy()">同意して続行</button></div>'
    +'</div>';
  document.body.appendChild(ov);
}
function acceptPrivacy(){
  showLoading('記録中...');
  google.script.run.withSuccessHandler(function(r){hideLoading();if(r.success){document.querySelector('.modal-overlay').remove();showToast('ご同意ありがとうございます');}else{showToast('エラー: '+(r.error||''));}}).withFailureHandler(function(e){hideLoading();showToast('エラー: '+e.message);}).api_recordPrivacyAcceptance();
}
window.onbeforeunload=function(){if(isDirty)return '未保存の変更があります。ページを離れますか？';};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var ov=document.querySelector('.modal-overlay');if(ov)ov.remove();}});

/* ============================================================
   Sidebar List
   ============================================================ */
function renderList(){
  var el=document.getElementById('wfList');
  if(!workflows.length){el.innerHTML='<div class="empty"><p style="font-size:13px">ワークフローがありません</p></div>';return;}
  var q=(document.getElementById('wfSearch')||{}).value||'';
  q=q.trim().toLowerCase();
  var filtered=q?workflows.filter(function(w){return String(w.name||'').toLowerCase().indexOf(q)!==-1;}):workflows;
  if(!filtered.length){el.innerHTML='<div class="empty"><p style="font-size:13px">「'+esc(q)+'」に一致するワークフローはありません</p></div>';return;}
  el.innerHTML=filtered.map(function(wf){
    var tb=wf.type==='申請・承認'?'<span class="badge badge-approval">承認</span>':'<span class="badge badge-template">定型文</span>';
    var sb=wf.status==='有効'?'<span class="badge badge-active">有効</span>':'<span class="badge badge-inactive">無効</span>';
    return '<div class="wf-item'+(wf.id===currentWfId?' active':'')+'" onclick="selectWf('+wf.id+')"><div class="wf-item-left"><div class="wf-item-name">'+esc(wf.name)+'</div><div class="wf-item-meta">'+tb+sb+'</div></div><label class="toggle" onclick="event.stopPropagation()"><input type="checkbox" '+(wf.status==='有効'?'checked':'')+' onchange="toggleWf('+wf.id+')"><span class="toggle-slider"></span></label></div>';
  }).join('');
}
function toggleWf(id){run('api_toggleStatus',id,function(r){if(r.success){var w=workflows.find(function(w){return w.id===id});if(w)w.status=r.status;renderList();showToast((r.status==='有効'?'有効':'無効')+'にしました');}});}
function selectWf(id){
  if(isDirty&&!confirm('未保存の変更があります。破棄しますか？'))return;
  isDirty=false;currentWfId=id;wfEditorTab='basic';renderList();
  run('api_getWorkflowDetail',id,function(d){currentFields=d.fields||[];currentButtons=d.buttons||[];renderEditor();});
}
function createNew(){
  if(isDirty&&!confirm('未保存の変更があります。破棄しますか？'))return;
  isDirty=false;currentWfId=null;currentFields=[];currentButtons=[];wfEditorTab='basic';renderEditor();
}

/* ============================================================
   Editor
   ============================================================ */
function renderEditor(){
  var wf=currentWfId?workflows.find(function(w){return w.id===currentWfId}):null;
  var name=wf?wf.name:'',type=wf?wf.type:'申請・承認',es=wf?wf.execSpace:'',ts=wf?wf.targetSpace:'',extSheet=wf?wf.externalSheet||'':'';
  var spO='<option value="">選択してください</option>'+spaces.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>';}).join('');
  var tab=wfEditorTab||'basic';
  var left='<div class="panel"><h2>'+(wf?esc(wf.name):'新規ワークフロー');
  if(wf)left+='<div style="display:flex;gap:5px"><button class="btn btn-sm" onclick="deployButton()" style="background:#e8f0fe;color:var(--c-primary)">設置</button><button class="btn btn-sm btn-danger" onclick="deleteWf()">削除</button></div>';
  left+='</h2>';
  // Chip nav
  left+='<div class="chip-nav">'
    +'<button class="chip'+(tab==='basic'?' active':'')+'" onclick="setWfTab(\'basic\')"><span class="chip-num">1</span>基本情報<span class="chip-error-dot" id="dotBasic" style="display:none"></span></button>'
    +'<button class="chip'+(tab==='fields'?' active':'')+'" onclick="setWfTab(\'fields\')"><span class="chip-num">2</span>フォーム項目<span class="chip-error-dot" id="dotFields" style="display:none"></span></button>'
    +'<button class="chip'+(tab==='notify'?' active':'')+'" onclick="setWfTab(\'notify\')"><span class="chip-num">3</span>'+(type==='申請・承認'?'承認・通知':'通知設定')+'<span class="chip-error-dot" id="dotNotify" style="display:none"></span></button>'
    +'</div>';
  // Section 1: 基本情報
  left+='<div class="editor-section'+(tab!=='basic'?' hidden':'')+'" id="secBasic">'
    +'<div class="form-row"><div class="form-group"><label>ワークフロー名</label><input type="text" id="wfName" value="'+esc(name)+'" oninput="markDirty();updatePreview()"><div class="error-msg" id="errName">ワークフロー名を入力してください</div></div><div class="form-group"><label>種類</label><select id="wfType" onchange="markDirty();renderEditor()"><option value="申請・承認"'+(type==='申請・承認'?' selected':'')+'>申請・承認</option><option value="定型文送信"'+(type==='定型文送信'?' selected':'')+'>定型文送信</option></select></div></div>'
    +'<div class="form-row"><div class="form-group"><label>実行スペース</label><select id="wfExecSpace" onchange="markDirty()">'+spO+'</select><div class="error-msg" id="errExec">実行スペースを選択してください</div></div><div class="form-group"><label>送信先スペース</label><select id="wfTargetSpace" onchange="markDirty()">'+spO+'</select><div class="error-msg" id="errTarget">送信先スペースを選択してください</div></div></div>'
    +'</div>';
  // Section 2: フォーム項目
  left+='<div class="editor-section'+(tab!=='fields'?' hidden':'')+'" id="secFields">'
    +'<div class="section-label">フォーム項目</div><div class="field-list" id="fieldList">'+renderFields()+'</div><button class="btn-add" onclick="addField()"><span class="mi" style="font-size:18px">add</span>項目を追加</button><div class="error-msg" id="errFields">項目を1つ以上追加してください</div>'
    +'</div>';
  // Section 3: 承認・通知
  var s3='<div class="editor-section'+(tab!=='notify'?' hidden':'')+'" id="secNotify">';
  if(type==='申請・承認'){
    s3+='<div class="form-group"><label>承認者（送信先スペースから選択、空欄＝全員可）</label><div style="display:flex;gap:6px;align-items:center"><input type="text" id="wfApprovers" value="'+esc(wf?wf.approvers||'':'')+'" placeholder="メンバーから選択 or メール手入力（カンマ区切り）" oninput="markDirty()" style="flex:1"><button type="button" class="btn btn-sm" onclick="openApproverPicker()" style="white-space:nowrap"><span class="mi" style="font-size:16px;vertical-align:middle">group</span>メンバーから選択</button></div><input type="hidden" id="wfApproverUserIds" value="'+esc(wf?wf.approverUserIds||'':'')+'"><div id="wfApproverIdsHint" style="font-size:11px;color:var(--c-text-muted);margin-top:4px">'+(wf&&wf.approverUserIds?'✅ '+wf.approverUserIds.split(',').filter(function(s){return s.trim()}).length+'名にメンション通知が飛びます':'※メンバーから選択すると承認時に @メンション通知が飛びます')+'</div></div>';
    s3+='<div class="form-group"><label>メンション文言（承認者の @メンションに続く文）</label><input type="text" id="wfMentionText" value="'+esc(wf?wf.mentionText||'':'')+'" placeholder="承認をお願いします" oninput="markDirty()"><div style="font-size:11px;color:var(--c-text-muted);margin-top:4px">空欄なら「承認をお願いします」。変数: {申請者} {ワークフロー}</div></div>';
    s3+='<div class="section-label">アクションボタン</div><div class="field-list" id="btnList">'+renderButtons()+'</div><button class="btn-add" onclick="addButton()"><span class="mi" style="font-size:18px">add</span>ボタンを追加</button>';
  }
  s3+='<div class="form-group" style="margin-top:16px"><div class="checkbox-row"><input type="checkbox" id="wfExtCheck"'+(extSheet?' checked':'')+' onchange="markDirty();document.getElementById(\'wfExtUrl\').style.display=this.checked?\'\':\'none\'"><label for="wfExtCheck">外部スプレッドシートにもデータをコピーする</label></div><div id="wfExtUrl" style="'+(extSheet?'':'display:none')+';margin-top:8px"><input type="text" id="wfExtSheet" value="'+esc(extSheet)+'" placeholder="https://docs.google.com/spreadsheets/d/..." oninput="markDirty()"></div></div>';
  s3+='</div>';
  left+=s3;
  left+='<div class="actions"><button class="btn" onclick="cancel()">キャンセル</button><button class="btn btn-primary" onclick="save()">保存</button></div></div>';
  var right='<div><div class="panel preview-section"><h2>カードプレビュー</h2><div id="previewCard"></div></div>';
  if(type==='申請・承認')right+='<div class="panel preview-section"><h2>アクションフロー</h2><div id="previewFlow"></div></div>';
  right+='</div>';
  document.getElementById('mainArea').innerHTML='<div class="main-inner">'+left+right+'</div>';
  setTimeout(function(){if(es)document.getElementById('wfExecSpace').value=es;if(ts)document.getElementById('wfTargetSpace').value=ts;initSortable();updatePreview();},50);
}
function setWfTab(t){
  wfEditorTab=t;
  ['secBasic','secFields','secNotify'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.add('hidden');});
  var map={basic:'secBasic',fields:'secFields',notify:'secNotify'};
  var target=document.getElementById(map[t]);if(target)target.classList.remove('hidden');
  document.querySelectorAll('.chip-nav .chip').forEach(function(c){c.classList.remove('active');});
  var chips=document.querySelectorAll('.chip-nav .chip');
  var idx={basic:0,fields:1,notify:2}[t];
  if(chips[idx])chips[idx].classList.add('active');
}
function markDirty(){isDirty=true;}
function initSortable(){
  var fl=document.getElementById('fieldList');if(fl)Sortable.create(fl,{animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',handle:'.field-grip',onEnd:function(e){var it=currentFields.splice(e.oldIndex,1)[0];currentFields.splice(e.newIndex,0,it);markDirty();updatePreview();}});
  var bl=document.getElementById('btnList');if(bl)Sortable.create(bl,{animation:150,ghostClass:'sortable-ghost',handle:'.field-grip',onEnd:function(e){var it=currentButtons.splice(e.oldIndex,1)[0];currentButtons.splice(e.newIndex,0,it);markDirty();updatePreview();}});
}

/* ============================================================
   Render Items
   ============================================================ */
function renderFields(){
  if(!currentFields.length)return '<div style="padding:14px;text-align:center;color:var(--c-text-faint);font-size:12px">項目がありません</div>';
  return currentFields.map(function(f,i){var tl={text:'テキスト',textarea:'複数行',dropdown:'プルダウン',checkbox:'チェックボックス',date:'日付'}[f.type]||f.type;return '<div class="field-item" data-index="'+i+'"><div class="field-info"><span class="field-grip mi">drag_indicator</span><span class="field-name">'+esc(f.name)+'</span><span class="field-type">'+tl+'</span>'+(f.required?'<span class="field-required">必須</span>':'')+'</div><div class="field-actions"><button class="btn btn-sm" onclick="editField('+i+')">編集</button><button class="btn btn-sm btn-danger" onclick="removeField('+i+')"><span class="mi" style="font-size:16px">close</span></button></div></div>';}).join('');
}
function renderButtons(){
  if(!currentButtons.length)return '<div style="padding:14px;text-align:center;color:var(--c-text-faint);font-size:12px">ボタン未設定（デフォルトの承認/却下）</div>';
  return currentButtons.map(function(b,i){return '<div class="btn-card" data-index="'+i+'"><div class="btn-card-header"><div class="btn-card-title"><span class="field-grip mi">drag_indicator</span><span class="btn-color" style="background:'+(COLORS[b.color]||'#888')+'"></span>'+esc(b.name)+'</div><div class="field-actions"><button class="btn btn-sm" onclick="editButton('+i+')">編集</button><button class="btn btn-sm btn-danger" onclick="removeButton('+i+')"><span class="mi" style="font-size:16px">close</span></button></div></div><div class="btn-card-sub">→ 「'+esc(b.status)+'」'+(b.threadReply?' ・<span class="mi" style="font-size:14px">reply</span> 返信':'')+'</div></div>';}).join('');
}

/* ============================================================
   Preview
   ============================================================ */
function updatePreview(){
  var ce=document.getElementById('previewCard'),fe=document.getElementById('previewFlow');if(!ce)return;
  var nm=val('wfName')||'ワークフロー名',tp=val('wfType')||'申請・承認';
  var ic=tp==='申請・承認'?'🔔':'📝',tt=tp==='申請・承認'?ic+' 新しい申請':ic+' '+esc(nm);
  var rows='<div class="chat-card-row"><div class="chat-card-label">送信者</div><div class="chat-card-value">山田 太郎</div></div>';
  currentFields.forEach(function(f){var s={dropdown:f.options?(f.options.split(',')[0].trim()):'選択肢',date:'2026/09/18',textarea:'テキスト内容...',checkbox:f.options?(f.options.split(',')[0].trim()):'選択肢'}[f.type]||'入力例';rows+='<div class="chat-card-row"><div class="chat-card-label">'+esc(f.name)+(f.required?' *':'')+'</div><div class="chat-card-value">'+esc(s)+'</div></div>';});
  if(tp==='申請・承認')rows+='<div class="chat-card-row"><div class="chat-card-label">ステータス</div><div class="chat-card-value">⏳ 承認待ち</div></div>';
  var btns='';if(tp==='申請・承認'){var bl=currentButtons.length?currentButtons:[{name:'承認',color:'green'},{name:'却下',color:'red'}];btns='<div class="chat-card-buttons">'+bl.map(function(b){return '<div class="chat-btn" style="background:'+(COLORS[b.color]||'#888')+'">'+esc(b.name)+'</div>';}).join('')+'</div>';}
  ce.innerHTML='<div class="chat-card"><div class="chat-card-header"><div class="chat-card-header-title">'+tt+'</div><div class="chat-card-header-sub">'+esc(nm)+' - 山田 太郎</div></div><div class="chat-card-body">'+rows+'</div>'+btns+'</div><div class="preview-label">Google Chat での表示イメージ</div>';
  if(fe&&tp==='申請・承認'){var bl2=currentButtons.length?currentButtons:[{name:'承認',status:'承認',color:'green',threadReply:false},{name:'却下',status:'却下',color:'red',threadReply:false}];var fh='';bl2.forEach(function(b,i){fh+='<div class="step-block"><div class="step-block-title">'+(EMOJI[b.color]||'⚪')+' 「'+esc(b.name)+'」が押されたら</div><div class="step-block-content">ステータス → 「'+esc(b.status||b.name)+'」'+(b.threadReply?'<br>📝 返信: '+esc((b.replyMsg||'').substring(0,50)):'<br><span style="color:#bbb">ステータス変更のみ</span>')+'</div></div>';if(i<bl2.length-1)fh+='<div class="step-arrow">↓</div>';});fh+='<div class="step-arrow">↓</div><div class="step-block"><div class="step-block-title">✅ 完了</div><div class="step-block-content">カードが更新されボタンが消えます</div></div>';fe.innerHTML=fh;}
}

/* ============================================================
   Field Modal
   ============================================================ */
function addField(){showFieldModal(-1)}
function editField(i){showFieldModal(i)}
function removeField(i){currentFields.splice(i,1);markDirty();document.getElementById('fieldList').innerHTML=renderFields();initSortable();updatePreview();hideError('errFields');}
function showFieldModal(idx){
  var f=idx>=0?currentFields[idx]:{name:'',type:'text',options:'',required:false};
  var ov=mk('modal-overlay');ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal"><h3>'+(idx>=0?'項目の編集':'項目の追加')+'</h3><div class="form-group"><label>項目名</label><input type="text" id="fName" value="'+esc(f.name)+'"><div class="error-msg" id="errFName">項目名を入力してください</div></div><div class="form-group"><label>入力タイプ</label><select id="fType" onchange="toggleOpts()"><option value="text"'+(f.type==='text'?' selected':'')+'>テキスト（1行）</option><option value="textarea"'+(f.type==='textarea'?' selected':'')+'>テキスト（複数行）</option><option value="dropdown"'+(f.type==='dropdown'?' selected':'')+'>プルダウン</option><option value="checkbox"'+(f.type==='checkbox'?' selected':'')+'>チェックボックス</option><option value="date"'+(f.type==='date'?' selected':'')+'>日付</option></select></div><div class="form-group" id="optsG" style="'+((f.type==='dropdown'||f.type==='checkbox')?'':'display:none')+'"><label>選択肢（カンマ区切り）</label><input type="text" id="fOpts" value="'+esc(f.options)+'"></div><div class="form-group"><div class="checkbox-row"><input type="checkbox" id="fReq"'+(f.required?' checked':'')+'><label for="fReq">必須項目にする</label></div></div><div class="actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">キャンセル</button><button class="btn btn-primary" onclick="saveField('+idx+')">保存</button></div></div>';
  document.body.appendChild(ov);
}
function toggleOpts(){document.getElementById('optsG').style.display=(document.getElementById('fType').value==='dropdown'||document.getElementById('fType').value==='checkbox')?'':'none';}
function saveField(idx){
  var n=document.getElementById('fName').value.trim();
  if(!n){showError('errFName');return;}
  hideError('errFName');
  var f={name:n,type:document.getElementById('fType').value,options:document.getElementById('fOpts')?document.getElementById('fOpts').value:'',required:document.getElementById('fReq').checked,order:idx>=0?currentFields[idx].order:currentFields.length+1};
  if(idx>=0)currentFields[idx]=f;else currentFields.push(f);
  markDirty();document.querySelector('.modal-overlay').remove();document.getElementById('fieldList').innerHTML=renderFields();initSortable();updatePreview();hideError('errFields');
}

/* ============================================================
   Button Modal
   ============================================================ */
function addButton(){showButtonModal(-1)}
function editButton(i){showButtonModal(i)}
function removeButton(i){currentButtons.splice(i,1);markDirty();document.getElementById('btnList').innerHTML=renderButtons();initSortable();updatePreview();}
function showButtonModal(idx){
  var b=idx>=0?currentButtons[idx]:{name:'',status:'',color:'green',threadReply:false,replyMsg:''};
  var ov=mk('modal-overlay');ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal"><h3>'+(idx>=0?'ボタンの編集':'ボタンの追加')+'</h3><div class="form-row"><div class="form-group"><label>ボタン名</label><input type="text" id="bName" value="'+esc(b.name)+'" placeholder="承認"><div class="error-msg" id="errBName">ボタン名を入力してください</div></div><div class="form-group"><label>ステータス値</label><input type="text" id="bStatus" value="'+esc(b.status)+'" placeholder="承認"><div class="error-msg" id="errBStatus">ステータス値を入力してください</div></div></div><div class="form-group"><label>色</label><div class="color-palette">'+Object.keys(COLORS).map(function(k){return '<div class="color-dot'+(b.color===k?' selected':'')+'" style="background:'+COLORS[k]+'" onclick="selColor(this,\''+k+'\')"></div>';}).join('')+'</div><input type="hidden" id="bColor" value="'+esc(b.color)+'"></div><div class="action-section"><div class="checkbox-row"><input type="checkbox" id="bThread"'+(b.threadReply?' checked':'')+' onchange="toggleBT()"><label for="bThread">スレッドに返信する</label></div><div id="bTMsg" style="'+(b.threadReply?'':'display:none')+';margin-top:8px"><input type="text" id="bReplyMsg" value="'+esc(b.replyMsg)+'" placeholder="{申請者}の申請が{ステータス}されました" style="font-size:12px"></div></div><div style="margin-top:6px;font-size:10px;color:var(--c-text-faint)">変数: {申請者} {ステータス} {ワークフロー}</div><div class="actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">キャンセル</button><button class="btn btn-primary" onclick="saveButton('+idx+')">保存</button></div></div>';
  document.body.appendChild(ov);
}
function selColor(el,c){document.querySelectorAll('.color-dot').forEach(function(d){d.classList.remove('selected')});el.classList.add('selected');document.getElementById('bColor').value=c;}
function toggleBT(){document.getElementById('bTMsg').style.display=document.getElementById('bThread').checked?'':'none';}
function saveButton(idx){

/* ============================================================
   Save / Delete / Deploy
   ============================================================ */
function save(){
  var errBasic=false,errFieldsSec=false;
  if(!val('wfName')){showError('errName');errBasic=true;}else hideError('errName');
  if(!val('wfExecSpace')){showError('errExec');errBasic=true;}else hideError('errExec');
  if(!val('wfTargetSpace')){showError('errTarget');errBasic=true;}else hideError('errTarget');
  if(!currentFields.length){showError('errFields');errFieldsSec=true;}else hideError('errFields');
  var dBasic=document.getElementById('dotBasic'),dFields=document.getElementById('dotFields'),dNotify=document.getElementById('dotNotify');
  if(dBasic)dBasic.style.display=errBasic?'':'none';
  if(dFields)dFields.style.display=errFieldsSec?'':'none';
  if(dNotify)dNotify.style.display='none';
  if(errBasic||errFieldsSec){
    if(errBasic)setWfTab('basic');else if(errFieldsSec)setWfTab('fields');
    showToast('入力に不備があります');
    return;
  }
  var data={id:currentWfId,name:val('wfName'),type:val('wfType'),execSpace:val('wfExecSpace'),targetSpace:val('wfTargetSpace'),
    approvers:val('wfApprovers'),
    approverUserIds:val('wfApproverUserIds'),
    mentionText:val('wfMentionText')||'',
    externalSheet:document.getElementById('wfExtCheck')&&document.getElementById('wfExtCheck').checked?val('wfExtSheet'):'',
    fields:currentFields.map(function(f,i){return{name:f.name,type:f.type,options:f.options,required:f.required,order:i+1}}),
    buttons:currentButtons.map(function(b,i){return{name:b.name,status:b.status,color:b.color,threadReply:b.threadReply,replyMsg:b.replyMsg,order:i+1}})};
  showLoading('保存中...');
  run('api_saveWorkflow',data,function(r){
    if(r.error){showToast('エラー: '+r.error);return;}
    isDirty=false;
    var ex=workflows.findIndex(function(w){return w.id===r.id});
    var nw={id:r.id,name:data.name,type:data.type,execSpace:data.execSpace,targetSpace:data.targetSpace,status:'有効',approvers:data.approvers||'',approverUserIds:data.approverUserIds||'',mentionText:data.mentionText||'',externalSheet:data.externalSheet||''};
    if(ex>=0)workflows[ex]=nw;else workflows.push(nw);
    currentWfId=r.id;showToast('保存しました');renderList();
  });
}
/* ============================================================
   Approver Picker Modal - 送信先スペースのメンバーから承認者選択
   ============================================================ */
function openApproverPicker(){
  var ts=val('wfTargetSpace');
  if(!ts){showToast('先に送信先スペースを選択してください');return;}
  var ov=mk('modal-overlay');ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal" style="max-width:520px"><h3>メンバーから承認者を選択</h3>'
    +'<p style="font-size:12px;color:var(--c-text-muted);margin:8px 0">送信先スペースのメンバーから選択できます。選択した相手には申請投稿時に @メンション通知が飛びます。</p>'
    +'<div style="margin:8px 0"><input type="text" id="apkSearch" placeholder="名前で絞り込み" oninput="filterApproverPicker()" style="width:100%;padding:8px 12px;border:1px solid var(--c-border);border-radius:8px"></div>'
    +'<div id="apkList" style="max-height:340px;overflow:auto;border:1px solid var(--c-border);border-radius:8px;padding:6px"><div class="empty" style="padding:20px">読み込み中...</div></div>'
    +'<div style="font-size:11px;color:var(--c-text-muted);margin-top:6px"><span id="apkCount">0名選択中</span></div>'
    +'<div class="actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">キャンセル</button><button class="btn btn-primary" onclick="applyApproverPicker()">決定</button></div></div>';
  document.body.appendChild(ov);
  showLoading('メンバー取得中...');
  google.script.run.withSuccessHandler(function(members){
    hideLoading();
    if(!members||!members.length){document.getElementById('apkList').innerHTML='<div class="empty" style="padding:20px">メンバーが取得できませんでした。Bot が対象スペースに参加していない可能性があります。一度ワークフローを保存して「設置」ボタンを押してから再度お試しください。</div>';return;}
    var currentIds=(val('wfApproverUserIds')||'').split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
    window.__apkMembers=members;
    renderApproverPicker(currentIds);
  }).withFailureHandler(function(e){hideLoading();document.getElementById('apkList').innerHTML='<div class="empty" style="padding:20px;color:var(--c-danger)">エラー: '+esc(e.message)+'</div>';}).api_getSpaceMembers(ts);
}
function renderApproverPicker(preselectedIds){
  var members=window.__apkMembers||[];
  var q=(document.getElementById('apkSearch').value||'').toLowerCase();
  var filtered=q?members.filter(function(m){return (m.displayName||'').toLowerCase().indexOf(q)>=0||(m.email||'').toLowerCase().indexOf(q)>=0;}):members;
  var html=filtered.map(function(m){
    var checked=preselectedIds.indexOf(m.userId)>=0?' checked':'';
    return '<label style="display:flex;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer" onmouseover="this.style.background=\'var(--c-hover)\'" onmouseout="this.style.background=\'\'"><input type="checkbox" class="apkCbx" data-uid="'+esc(m.userId)+'" data-email="'+esc(m.email||'')+'" onchange="updateApkCount()"'+checked+' style="margin-right:10px"><span style="flex:1"><b>'+esc(m.displayName||'(名前不明)')+'</b>'+(m.email?'<span style="font-size:11px;color:var(--c-text-muted);margin-left:8px">'+esc(m.email)+'</span>':'<span style="font-size:11px;color:var(--c-danger);margin-left:8px">メール未取得</span>')+'</span></label>';
  }).join('');
  document.getElementById('apkList').innerHTML=html||'<div class="empty" style="padding:20px">該当メンバーなし</div>';
  updateApkCount();
}
function filterApproverPicker(){
  var currentSelection=[].slice.call(document.querySelectorAll('.apkCbx:checked')).map(function(cb){return cb.getAttribute('data-uid');});
  renderApproverPicker(currentSelection);
}
function updateApkCount(){
  var n=document.querySelectorAll('.apkCbx:checked').length;
  var c=document.getElementById('apkCount');if(c)c.textContent=n+'名選択中';
}
function applyApproverPicker(){
  var selected=[].slice.call(document.querySelectorAll('.apkCbx:checked'));
  var emails=selected.map(function(cb){return cb.getAttribute('data-email');}).filter(function(e){return e;});
  var uids=selected.map(function(cb){return cb.getAttribute('data-uid');}).filter(function(u){return u;});
  document.getElementById('wfApprovers').value=emails.join(', ');
  document.getElementById('wfApproverUserIds').value=uids.join(',');
  var h=document.getElementById('wfApproverIdsHint');
  if(h)h.innerHTML=uids.length?'✅ '+uids.length+'名にメンション通知が飛びます':'※メンバーから選択すると承認時に @メンション通知が飛びます';
  markDirty();
  document.querySelector('.modal-overlay').remove();
  showToast(uids.length+'名を承認者に設定しました');
}

function deleteWf(){
  var wf=workflows.find(function(w){return w.id===currentWfId});if(!wf)return;
  var ov=mk('modal-overlay');
  ov.innerHTML='<div class="modal"><h3>アーカイブの確認</h3><p style="margin:12px 0;color:var(--c-text-sub)">「'+esc(wf.name)+'」をアーカイブしますか？<br><span style="font-size:12px;color:var(--c-text-muted)">30日以内なら「アーカイブ」から復元できます。30日経過後に完全削除されます。</span></p><div class="actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">キャンセル</button><button class="btn btn-danger" onclick="confirmDelete()">アーカイブ</button></div></div>';
  document.body.appendChild(ov);
}
function confirmDelete(){
  document.querySelector('.modal-overlay').remove();var did=currentWfId;
  showLoading('アーカイブ中...');
  google.script.run.withSuccessHandler(function(){hideLoading();isDirty=false;workflows=workflows.filter(function(w){return w.id!==did});currentWfId=null;showToast('アーカイブしました');renderList();document.getElementById('mainArea').innerHTML='<div class="empty"><span class="mi" style="font-size:56px;color:var(--c-text-faint)">assignment</span><p>ワークフローを選択してください</p></div>';}).withFailureHandler(function(e){hideLoading();showToast('エラー: '+e.message);}).api_deleteWorkflow(did);
}
function showArchive(){
  var ov=mk('modal-overlay');ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="modal"><h3>アーカイブ</h3><p style="font-size:12px;color:var(--c-text-muted);margin-bottom:12px">30日以内のアーカイブは復元できます。30日経過後に完全削除されます。</p><div id="archiveList" style="max-height:400px;overflow:auto"><div class="empty" style="padding:20px">読み込み中...</div></div><div class="actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">閉じる</button></div></div>';
  document.body.appendChild(ov);
  google.script.run.withSuccessHandler(function(list){
    var el=document.getElementById('archiveList');if(!el)return;
    if(!list||!list.length){el.innerHTML='<div class="empty" style="padding:20px;font-size:13px">アーカイブされたワークフローはありません</div>';return;}
    el.innerHTML=list.map(function(a){var d=a.archivedAt?new Date(a.archivedAt).toLocaleDateString('ja-JP'):'';return '<div class="admin-item"><div><div>'+esc(a.name)+'</div><div style="font-size:11px;color:var(--c-text-muted)">'+esc(a.type)+' · アーカイブ: '+d+'</div></div><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="restoreArchive('+a.id+')">復元</button><button class="btn btn-sm" style="color:var(--c-danger);border-color:var(--c-danger)" onclick="purgeArchive('+a.id+',\''+esc(a.name).replace(/\x27/g,'\\\x27')+'\')">完全削除</button></div></div>';}).join('');
  }).withFailureHandler(function(e){var el=document.getElementById('archiveList');if(el)el.innerHTML='<div style="padding:20px;color:var(--c-danger)">エラー: '+esc(e.message)+'</div>';}).api_getArchivedWorkflows();
}
function restoreArchive(id){
  showLoading('復元中...');
  google.script.run.withSuccessHandler(function(r){hideLoading();if(r.success){showToast('復元しました('+r.name+')');document.querySelector('.modal-overlay').remove();google.script.run.withSuccessHandler(function(list){workflows=list||[];renderList();}).api_getWorkflows();}else{showToast('エラー: '+(r.error||''));}}).withFailureHandler(function(e){hideLoading();showToast('エラー: '+e.message);}).api_restoreWorkflow(id);
}
function purgeArchive(id,name){
  if(!confirm('「'+name+'」を完全に削除します。この操作は取り消せません。データシートも削除されます。よろしいですか？'))return;
  showLoading('完全削除中...');
  google.script.run.withSuccessHandler(function(r){hideLoading();if(r.success){showToast('完全削除しました('+(r.name||name)+')');document.querySelector('.modal-overlay').remove();showArchive();}else{showToast('エラー: '+(r.error||''));}}).withFailureHandler(function(e){hideLoading();showToast('エラー: '+e.message);}).api_purgeWorkflow(id);
}
function deployButton(){
  if(!currentWfId)return;
  showLoading('設置中...');
  run('api_deployButton',currentWfId,function(r){showToast(r.success?'設置しました':'エラー: '+(r.error||''));});
}
function cancel(){
  if(isDirty&&!confirm('未保存の変更があります。破棄しますか？'))return;
  isDirty=false;currentWfId=null;
  document.getElementById('mainArea').innerHTML='<div class="empty"><span class="mi" style="font-size:56px;color:var(--c-text-faint)">assignment</span><p>ワークフローを選択してください</p></div>';
}

/* ============================================================
   Utilities
   ============================================================ */
function run(fn,arg,onSuccess){
  showLoading('処理中...');
  google.script.run
    .withSuccessHandler(function(r){hideLoading();if(onSuccess)onSuccess(r);})
    .withFailureHandler(function(e){hideLoading();showToast('エラー: '+e.message);})[fn](arg);
}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function showError(id){var el=document.getElementById(id);if(el){el.classList.add('show');var inp=el.previousElementSibling;if(inp)inp.classList.add('input-error');}}
function hideError(id){var el=document.getElementById(id);if(el){el.classList.remove('show');var inp=el.previousElementSibling;if(inp)inp.classList.remove('input-error');}}
function showLoading(msg){hideLoading();var d=mk('loading-toast');d.id='loadingToast';d.innerHTML='<div class="spinner"></div>'+esc(msg||'処理中...');document.body.appendChild(d);}
function hideLoading(){var el=document.getElementById('loadingToast');if(el)el.remove();}
function mk(c){var d=document.createElement('div');d.className=c;return d;}
function showToast(m){var t=mk('toast');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}
function noop(){}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
